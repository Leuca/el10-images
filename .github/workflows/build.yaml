name: Image CI
on:
  push:
    branches:
      - c10s-sky1
    pull_requests:

permissions: write-all

jobs:
  image:
    name: Build Image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Release string
        run: echo "release=sky1-$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
        id: release
      - name: Setup Podman
        run: |
          sudo apt update
          sudo apt-get -y install podman xz-utils
          sudo podman pull centos:latest
      - name: Get source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version source
        run: |
          VER=${{ steps.release.outputs.release }}
          sed -i "s/-Image/-$VER/g" config.xml
      - name: Create container and build images
        run: |
          export RUID=$(id -u)
          export RGID=$(id -g)
          sudo mkdir images
          sudo mkdir iso
          sudo podman build --tag imagebuilder -f Containerfile
          CID="$(sudo podman run --privileged --rmi -v /dev:/dev:dev,z -v $PWD:/sources:rw,z,shared,bind,U --workdir=/sources -d imagebuilder)"
          sudo podman exec $CID kiwi-ng --type=iso --profile="LiveInstallSky1" --color-output system build --description ./ --target-dir ./iso
          sudo cp -rf iso/*.iso images/
          sudo podman stop $CID
          sudo chown -R $RUID:$RGID *
      - name: Compress iso image
        run: |
          ISOS=(images/*.iso)
          xz -z -v -8 ${ISOS[0]}
      - name: Check release asset size
        run: |
          # GitHub refuses release assets over 2 GiB. The erofs payload is
          # already lzma-compressed, so xz only buys about 3% - the headroom
          # has to come from the image contents, not the compressor.
          LIMIT=$((2 * 1024 * 1024 * 1024))
          WARN=$((LIMIT * 90 / 100))
          rc=0
          for f in images/*.xz; do
            sz=$(stat -c%s "$f")
            printf '%s: %s bytes (%s%% of the 2 GiB limit)\n' \
              "$f" "$sz" "$((sz * 100 / LIMIT))"
            if [ "$sz" -ge "$LIMIT" ]; then
              echo "::error::$f exceeds the 2 GiB release asset limit"; rc=1
            elif [ "$sz" -ge "$WARN" ]; then
              echo "::warning::$f is within 10% of the 2 GiB release asset limit"
            fi
          done
          exit $rc
      - name: Sign
        uses: FKLC/sign-files-action@v1.0.0
        with:
          privateKey: ${{ secrets.PRIVATE_KEY }}
          extension: '.sha256.sig'
          outputFolder: 'images'
          files: |
            images/*.iso.xz
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "public_key.pem,images/*.iso.xz,images/*.sha256.sig"
          tag: ${{ steps.release.outputs.release }}
          commit: c10s-sky1
