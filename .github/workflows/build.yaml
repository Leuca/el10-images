name: rpi64 Image CI
on:
  push:
    branches:
      - c10s-rpi

# One build per branch at a time; a push during a build queues behind it.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions: write-all

jobs:
  image:
    name: Build Image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Release string
        run: |
          echo "release=rpi64-$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
        id: release
      - name: Setup Podman
        run: |
          sudo apt update
          sudo apt-get -y install podman xz-utils
          sudo podman pull centos:latest
      - name: Get source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version source
        run: |
          VER=${{ steps.release.outputs.release }}
          sed -i "s/-Image/-$VER/g" config.xml
      - name: Create container and build images
        run: |
          export RUID=$(id -u)
          export RGID=$(id -g)
          sudo mkdir images
          sudo mkdir iso
          sudo mkdir diskpi4
          sudo mkdir diskpi5
          sudo podman build --tag imagebuilder -f Containerfile
          CID="$(sudo podman run --privileged --rmi -v /dev:/dev:dev,z -v $PWD:/sources:rw,z,shared,bind,U --workdir=/sources -d imagebuilder)"
          sudo podman exec $CID kiwi-ng --type=iso --profile="LiveInstallPi" --color-output system build --description ./ --target-dir ./iso
          sudo sed -i "s/-rpi64/-pi4/g" config.xml
          sudo podman exec $CID kiwi-ng --type=oem --profile="MinimalDiskPi4" --color-output system build --description ./ --target-dir ./diskpi4
          sudo sed -i "s/-pi4/-pi5/g" config.xml
          sudo podman exec $CID kiwi-ng --type=oem --profile="MinimalDiskPi5" --color-output system build --description ./ --target-dir ./diskpi5
          sudo cp -rf iso/*.iso images/
          sudo cp -rf diskpi4/*.raw images/
          sudo cp -rf diskpi5/*.raw images/
          sudo podman stop $CID
          sudo chown -R $RUID:$RGID *
      - name: Compress raw disk image
        run: |
          IMGS=(images/*.raw)
          ISOS=(images/*.iso)
          xz -z -v -8 ${IMGS[0]}
          xz -z -v -8 ${IMGS[1]}
          xz -z -v -8 ${ISOS[0]}
      - name: Release notes
        run: |
          pkg() { awk -F'|' -v n="$1" '$1 == n { print $3 "-" $4 }' iso/*.packages; }
          {
            echo "CentOS Stream 10 images for the **Raspberry Pi 4 and 5**, aarch64:"
            echo "a live installer ISO plus ready-to-flash Pi 4 and Pi 5 disk images."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| kernel | $(pkg kernel) |"
            echo "| built from | ${{ github.sha }} (branch c10s-rpi) |"
            echo
            echo "Verify with public_key.pem and the .sha256.sig files."
          } > images/release-notes.md
          cat images/release-notes.md
      - name: Sign
        uses: FKLC/sign-files-action@v1.0.0
        with:
          privateKey: ${{ secrets.PRIVATE_KEY }}
          extension: '.sha256.sig'
          outputFolder: 'images'
          files: |
            images/*.iso.xz
            images/*.raw.xz
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "public_key.pem,images/*.iso.xz,images/*.raw.xz,images/*.sha256.sig"
          tag: ${{ steps.release.outputs.release }}
          name: "Raspberry Pi 4/5 CentOS Stream 10 - ${{ steps.release.outputs.date }}"
          bodyFile: images/release-notes.md
          # Tag the commit that was built, not whatever the branch points to now.
          commit: ${{ github.sha }}
          # Two platforms share this repository's releases; "Latest" would just
          # be whichever built last, so neither claims it.
          makeLatest: false
