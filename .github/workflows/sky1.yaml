name: Sky1 Image CI
on:
  push:
    branches:
      - c10s-sky1

# One build per branch at a time; a push during a build queues behind it.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  image:
    name: Build Image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Release string
        run: |
          echo "release=sky1-$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
        id: release
      - name: Setup Podman
        run: |
          sudo apt update
          sudo apt-get -y install podman
      - name: Get source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Version source
        run: |
          VER=${{ steps.release.outputs.release }}
          sed -i "s/-Image/-$VER/g" config.xml
      - name: Create container and build images
        run: |
          export RUID=$(id -u)
          export RGID=$(id -g)
          sudo mkdir images
          sudo mkdir iso
          sudo podman build --pull=always --tag imagebuilder -f Containerfile
          CID="$(sudo podman run --privileged --rmi -v /dev:/dev:dev,z -v $PWD:/sources:rw,z,shared,bind,U --workdir=/sources -d imagebuilder)"
          sudo podman exec $CID kiwi-ng --type=iso --profile="LiveInstallSky1" --color-output system build --description ./ --target-dir ./iso
          sudo cp -rf iso/*.iso images/
          sudo podman stop $CID
          sudo chown -R $RUID:$RGID *
      - name: Check release asset size
        run: |
          # GitHub refuses release assets over 2 GiB. The ISO is shipped
          # uncompressed: the erofs payload is already lzma level 9, so xz
          # recovered only ~3% for 10+ minutes of runner time. Headroom has
          # to come from the image contents, not from a compressor.
          LIMIT=$((2 * 1024 * 1024 * 1024))
          WARN=$((LIMIT * 90 / 100))
          rc=0
          for f in images/*.iso; do
            sz=$(stat -c%s "$f")
            printf '%s: %s bytes (%s%% of the 2 GiB limit)\n' \
              "$f" "$sz" "$((sz * 100 / LIMIT))"
            if [ "$sz" -ge "$LIMIT" ]; then
              echo "::error::$f exceeds the 2 GiB release asset limit"; rc=1
            elif [ "$sz" -ge "$WARN" ]; then
              echo "::warning::$f is within 10% of the 2 GiB release asset limit"
            fi
          done
          exit $rc
      - name: Release notes
        run: |
          pkg() { awk -F'|' -v n="$1" '$1 == n { print $3 "-" $4 }' iso/*.packages; }
          {
            echo "CentOS Stream 10 live installer for the **Radxa Orion O6N** (CIX Sky1), aarch64."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| kernel | $(pkg kernel) |"
            echo "| sky1-release | $(pkg sky1-release) |"
            echo "| built from | ${{ github.sha }} (branch c10s-sky1) |"
            echo
            echo "Verify with public_key.pem and the .sha256.sig file."
          } > images/release-notes.md
          cat images/release-notes.md
      - name: Sign
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          # A raw RSA-SHA256 (PKCS#1 v1.5) signature of each file, the same
          # bytes FKLC/sign-files-action produced. Verify with:
          #   openssl dgst -sha256 -verify public_key.pem \
          #     -signature <file>.sha256.sig <file>
          # Done here so the private key never reaches third-party code.
          umask 077
          key="$RUNNER_TEMP/signing.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$key"
          for f in images/*.iso; do
            openssl dgst -sha256 -sign "$key" -out "$f.sha256.sig" "$f"
            openssl dgst -sha256 -verify public_key.pem -signature "$f.sha256.sig" "$f"
          done
      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: "public_key.pem,images/*.iso,images/*.sha256.sig"
          tag: ${{ steps.release.outputs.release }}
          name: "Radxa Orion O6N (Sky1) CentOS Stream 10 - ${{ steps.release.outputs.date }}"
          bodyFile: images/release-notes.md
          # Tag the commit that was built, not whatever the branch points to now.
          commit: ${{ github.sha }}
          # Two platforms share this repository's releases; "Latest" would just
          # be whichever built last, so neither claims it.
          makeLatest: false
